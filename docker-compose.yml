services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kref-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
      - "${REVERB_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-kref}
      DB_USERNAME: ${MYSQL_APP_USER:-kref}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      REVERB_HOST: 0.0.0.0
    volumes:
      - storage_data:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - kref-network

  mysql:
    image: mysql:8.0
    container_name: kref-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kref}
      MYSQL_USER: ${MYSQL_APP_USER:-kref}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kref-network

  redis:
    image: redis:7-alpine
    container_name: kref-redis
    restart: unless-stopped
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - kref-network

networks:
  kref-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  storage_data:
