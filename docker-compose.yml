services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${APP_NAME:-Kref}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8080}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
    container_name: kref-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
      - "${REVERB_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-kref}
      DB_USERNAME: ${MYSQL_APP_USER:-kref}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      REVERB_HOST: 0.0.0.0
      WAHA_BASE_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:-APIKeyRahasiaKamu123!}
      WAHA_SESSION: ${WAHA_SESSION:-kref}
    volumes:
      - storage_data:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      waha:
        condition: service_started
    networks:
      - kref-network

  mysql:
    image: mysql:8.0
    container_name: kref-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kref}
      MYSQL_USER: ${MYSQL_APP_USER:-kref}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kref-network

  redis:
    image: redis:7-alpine
    container_name: kref-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - kref-network
  
  waha:
    image: devlikeapro/waha:latest
    container_name: kref-waha
    restart: unless-stopped
    environment:
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD:-PasswordRahasiaKamu123!}
      - WAHA_API_KEY=${WAHA_API_KEY:-APIKeyRahasiaKamu123!}
      - WAHA_PRINT_QR=true
      - WHATSAPP_DEFAULT_ENGINE=WEBJS
      - TZ=Asia/Makassar
    ports:
      - "127.0.0.1:${WAHA_PORT:-3000}:3000"
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      - kref-network

networks:
  kref-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  storage_data:
  waha_sessions:
